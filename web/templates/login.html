{{define "content"}}
<header class="page-hero page-hero-compact">
    <div>
        <p class="eyebrow">Access</p>
        <h1>DCPortal</h1>
        <p class="subtitle">{{.Subtitle}}</p>
    </div>
</header>

<section class="card auth-card card-elevated">
    <h2>{{.Heading}}</h2>
    {{if .Error}}
    <p class="error-message">{{.Error}}</p>
    {{end}}
    <form method="POST" action="{{.FormAction}}" class="form-stack">
        <input type="hidden" name="next" value="{{.Next}}">
        <div class="form-group">
            <label for="token">{{.TokenLabel}}</label>
            <input type="password" id="token" name="token" placeholder="Enter token" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary">Continue</button>
    </form>
</section>
{{end}}
