{{define "content"}}
<header>
    <h1>🤖 DCPortal</h1>
    <p class="subtitle">Authorized Bot Installation</p>
</header>

{{if .Links}}
<div class="bot-grid">
    {{range .Links}}
    <div class="card bot-card">
        <h3>{{.BotName}}</h3>
        <p>{{.Name}}</p>
        <p class="muted">Scopes: {{.Scopes}}</p>
        <a href="/install/{{.ID}}" class="btn btn-primary">Install Bot</a>
    </div>
    {{end}}
</div>
{{else}}
<div class="card">
    <p class="muted">No bots available for installation.</p>
</div>
{{end}}

<footer>
    <a href="/admin">Go To Admin</a>
    <form method="POST" action="/logout" class="inline-form">
        <button type="submit" class="btn btn-sm">Logout</button>
    </form>
</footer>
{{end}}
